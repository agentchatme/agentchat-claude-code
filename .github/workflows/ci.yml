name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile now that the engine is a published, pinned version
      # rather than a filesystem link to a checkout of its moving main branch.
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test

      # The daemon must actually run, with no node_modules beside it — which is
      # its environment after the installer copies it out of the NPX cache. Its
      # predecessor was wired to a command that did not exist and restart-looped
      # in production behind a green pipeline.
      # The daemon is RESIDENT — it idles without an identity rather than
      # exiting, so this must BOUND the run instead of waiting for it. An
      # earlier version of this step waited for an exit that no longer comes
      # and hung the job until it timed out.
      - name: the daemon entry is resident and idles without an identity
        if: runner.os == 'Linux'
        run: |
          out="$(mktemp)"
          ( cd "$(mktemp -d)" && node "$GITHUB_WORKSPACE/dist/daemon-main.js" --home "$(mktemp -d)" >"$out" 2>&1 ) &
          pid=$!
          sleep 6
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          cat "$out"
          # RESIDENT means it is still running after 6s. The old daemon exited
          # here, and a check that waited for an exit hung this job instead.
          [ "$alive" = "1" ] || { echo "::error::the daemon exited instead of idling"; exit 1; }
          grep -q "integration resident" "$out" || { echo "::error::the daemon did not come up"; exit 1; }
          if grep -qE "Unknown option|Dynamic require|Cannot find module" "$out"; then
            echo "::error::the daemon failed at startup"; exit 1
          fi
          echo "daemon is resident and idling ✓"

      # The release workflow's tarball smoke, on every PR, so it cannot go
      # stale between releases. It did once: it still expected the
      # pre-doorbell integration and failed the 0.1.0 publish after the tag.
      - name: the packed tarball installs and runs (release smoke)
        if: runner.os == 'Linux'
        run: bash scripts/release-smoke.sh

  # Secret scan of the new commits only: the pull request's range, or the
  # push's. The default gitleaks rules plus the AgentChat API key rule
  # (.gitleaks.toml).
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checksum-pinned, cached: a download happens only on a cache miss
      # (.github/actions/install-pinned-binary).
      - uses: ./.github/actions/install-pinned-binary
        with:
          name: gitleaks
          version: 8.30.1
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks

      - name: Select commits to scan
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "range=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "range=${HEAD_SHA}^..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BEFORE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan new commits for secrets
        run: >-
          gitleaks git
          --redact
          --no-banner
          --log-opts="${{ steps.commits.outputs.range }}"
          .
