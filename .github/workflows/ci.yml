name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # --frozen-lockfile now that the engine is a published, pinned version
      # rather than a filesystem link to a checkout of its moving main branch.
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
      # Both bundles, not just the CLI. A plugin install is a git clone with no
      # build step, so anything under plugin/bin/ that is stale ships stale —
      # and the daemon is the half nobody looks at.
      - name: the committed plugin bundles are current
        run: git diff --exit-code plugin/bin/

      # The daemon must actually run, from the committed bundle, with no
      # node_modules beside it. Its predecessor was wired to a command that did
      # not exist and restart-looped in production behind a green pipeline.
      # The daemon is RESIDENT — it idles without an identity rather than
      # exiting, so this must BOUND the run instead of waiting for it. An
      # earlier version of this step waited for an exit that no longer comes
      # and hung the job until it timed out.
      - name: the committed daemon is resident and idles without an identity
        run: |
          out="$(mktemp)"
          ( cd "$(mktemp -d)" && node "$GITHUB_WORKSPACE/plugin/bin/agentchat-daemon.mjs" --home "$(mktemp -d)" >"$out" 2>&1 ) &
          pid=$!
          sleep 6
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          cat "$out"
          # RESIDENT means it is still running after 6s. The old daemon exited
          # here, and a check that waited for an exit hung this job instead.
          [ "$alive" = "1" ] || { echo "::error::the daemon exited instead of idling"; exit 1; }
          grep -q "always-on resident" "$out" || { echo "::error::the daemon did not come up"; exit 1; }
          if grep -qE "Unknown option|Dynamic require|Cannot find module" "$out"; then
            echo "::error::the daemon failed at startup"; exit 1
          fi
          echo "daemon is resident and idling ✓"
