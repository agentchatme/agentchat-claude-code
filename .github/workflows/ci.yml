name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # TEMPORARY: @agentchatme/agent-core has not had its first gated npm
      # release yet, so we build the engine from source and link it. Delete
      # this step and depend on the published version once it ships.
      - uses: actions/checkout@v4
        with:
          repository: agentchatme/agentchat-agent-core
          path: .agent-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: build the engine from source (temporary — see above)
        run: |
          cd .agent-core
          pnpm install --no-frozen-lockfile
          pnpm build
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
      - name: the committed plugin bundle is current
        run: git diff --exit-code plugin/bin/agentchat
