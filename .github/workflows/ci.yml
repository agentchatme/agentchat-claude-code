name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # TEMPORARY: @agentchatme/agent-core has not had its first gated npm
      # release yet, so we build the engine from source and link it. Delete
      # this step and depend on the published version once it ships.
      - uses: actions/checkout@v4
        with:
          repository: agentchatme/agentchat-agent-core
          path: .agent-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: build the engine from source (temporary — see above)
        run: |
          cd .agent-core
          pnpm install --no-frozen-lockfile
          pnpm build
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
      # Both bundles, not just the CLI. A plugin install is a git clone with no
      # build step, so anything under plugin/bin/ that is stale ships stale —
      # and the daemon is the half nobody looks at.
      - name: the committed plugin bundles are current
        run: git diff --exit-code plugin/bin/

      # The daemon must actually run, from the committed bundle, with no
      # node_modules beside it. Its predecessor was wired to a command that did
      # not exist and restart-looped in production behind a green pipeline.
      - name: the committed daemon starts
        run: |
          out="$(node plugin/bin/agentchat-daemon.mjs --home "$(mktemp -d)" 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"no AgentChat identity"*) echo "daemon reached identity resolution ✓" ;;
            *) echo "::error::the daemon did not start: $out"; exit 1 ;;
          esac
