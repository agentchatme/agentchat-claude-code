name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # --frozen-lockfile now that the engine is a published, pinned version
      # rather than a filesystem link to a checkout of its moving main branch.
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
      # Both bundles, not just the CLI. A plugin install is a git clone with no
      # build step, so anything under plugin/bin/ that is stale ships stale —
      # and the daemon is the half nobody looks at.
      - name: the committed plugin bundles are current
        run: git diff --exit-code plugin/bin/

      # The daemon must actually run, from the committed bundle, with no
      # node_modules beside it. Its predecessor was wired to a command that did
      # not exist and restart-looped in production behind a green pipeline.
      # The daemon is RESIDENT — it idles without an identity rather than
      # exiting, so this must BOUND the run instead of waiting for it. An
      # earlier version of this step waited for an exit that no longer comes
      # and hung the job until it timed out.
      - name: the committed daemon is resident and idles without an identity
        run: |
          out="$(mktemp)"
          ( cd "$(mktemp -d)" && node "$GITHUB_WORKSPACE/plugin/bin/agentchat-daemon.mjs" --home "$(mktemp -d)" >"$out" 2>&1 ) &
          pid=$!
          sleep 6
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          cat "$out"
          # RESIDENT means it is still running after 6s. The old daemon exited
          # here, and a check that waited for an exit hung this job instead.
          [ "$alive" = "1" ] || { echo "::error::the daemon exited instead of idling"; exit 1; }
          grep -q "always-on resident" "$out" || { echo "::error::the daemon did not come up"; exit 1; }
          if grep -qE "Unknown option|Dynamic require|Cannot find module" "$out"; then
            echo "::error::the daemon failed at startup"; exit 1
          fi
          echo "daemon is resident and idling ✓"

  # ── main IS production for this repo ──
  #
  # A plugin install is a git clone of this repository, so whatever is on main
  # is what the next `/plugin install` fetches. There is no publish step to act
  # as the moment someone decides to ship.
  #
  # Claude Code records an install as version + commit sha. So the failure to
  # prevent is two different bundles both claiming to be 0.0.1392 — a user's
  # recorded version would no longer identify what they actually have, and
  # "which build is this?" becomes unanswerable.
  #
  # Changing the shipped artifact therefore has to declare a new version. That
  # makes the version bump the deliberate act, enforced rather than remembered.
  release-declared:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: a change under plugin/ must come with a new version
        run: |
          git rev-parse HEAD~1 >/dev/null 2>&1 || { echo "no previous commit; nothing to compare"; exit 0; }
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- plugin/)" ]; then
            echo "plugin/ unchanged — no version bump needed ✓"; exit 0
          fi
          echo "changed under plugin/:"
          git diff --name-only HEAD~1 HEAD -- plugin/ | sed 's/^/  /'
          git show HEAD~1:package.json > /tmp/prev-package.json
          prev="$(node -p "require('/tmp/prev-package.json').version")"
          curr="$(node -p "require('./package.json').version")"
          echo "version: $prev -> $curr"
          if [ "$prev" = "$curr" ]; then
            echo "::error::plugin/ changed but the version is still $curr. Users install by cloning main, and an install is recorded as version+sha — two different bundles must never share a version."
            exit 1
          fi
          echo "a new version was declared ✓"
