name: publish

# OIDC trusted publishing for @agentchatme/claude-code, gated by a human
# approval. The first package version was necessarily bootstrapped directly:
# npm cannot attach a trusted publisher until the package exists.
#
# npm Trusted Publisher:
#   GitHub org/user: agentchatme
#   repository:      agentchat-claude-code
#   workflow:        publish.yml
#   environment:     npm-publish
#   allowed action:  npm publish
#
# Release flow: bump package.json → tag `v<version>` → push → approve.

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test
      - name: tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME != package $pkg"
            exit 1
          }

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >=11.5.1. The runner's bundled npm is
      # not a stable contract, so install the current CLI explicitly.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: the published tarball is self-contained and the doorbell installs from it
        id: pack
        run: bash scripts/release-smoke.sh

      - run: npm publish "${{ steps.pack.outputs.tgz }}" --ignore-scripts --provenance --access public
